<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Рапорт — легкие фронтенд-дашборды для анализа Excel и CSV-отчетов. Файлы обрабатываются локально в браузере."
    />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem("raport-theme") === "dark" ? "dark" : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta property="og:title" content="Рапорт" />
    <meta property="og:description" content="Excel докладывает главное: локальный анализ CSV/XLS/XLSX-отчетов в браузере." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Рапорт</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
